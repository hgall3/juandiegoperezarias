<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fotógrafo, documentalista y escritor ecuatoriano. Recorre el país fotografiando lugares remotos e historias olvidadas. Conoce sus libros y documentales."
    />
    <title>Juan Diego Perez Arias | Fotógrafo, documentalista y escritor</title>

    <!--
      Picks the theme before anything is painted, so the page never shows one
      mode and then blinks into the other. It has to be inline and here, ahead
      of the stylesheet: a module script is deferred, and React has not mounted
      yet either.

      Two steps only. The visitor's own choice wins, and otherwise the system
      decides — which on a machine set to switch at sunset is already a clock,
      and a better one than an hour written in here would be.

      React reads whatever this sets rather than deciding again, so the two
      cannot disagree.
    -->
    <script>
      (function () {
        var stored = null

        try {
          stored = localStorage.getItem('theme')
        } catch (error) {
          // Private windows and blocked storage both throw. Not knowing the
          // visitor's last choice is survivable; failing to set a theme is not.
        }

        var chosen = stored === 'dark' || stored === 'light'
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches

        document.documentElement.dataset.theme = chosen
          ? stored
          : dark
            ? 'dark'
            : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
